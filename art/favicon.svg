<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Output Style logo">
  <defs>
    <linearGradient id="bgO" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A2724"/><stop offset="1" stop-color="#121110"/>
    </linearGradient>
    <linearGradient id="bubO" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF7F1"/><stop offset="1" stop-color="#E7DED1"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bgO)"/>
  <rect x="3" y="3" width="506" height="506" rx="109" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="6"/>

<g transform="translate(256 262) scale(1.2) translate(-256 -256)">

  <!-- speech bubble + tail -->
  <path d="M150 300 L150 404 L224 318 Z" fill="url(#bubO)"/>
  <rect x="96" y="104" width="320" height="224" rx="52" fill="url(#bubO)"/>

  <!-- three style lines -->
  <g>
    <rect x="144" y="156" width="184" height="22" rx="11" fill="#D97757"/>
    <rect x="144" y="200" width="224" height="22" rx="11" fill="#E0A83F"/>
    <rect x="144" y="244" width="136" height="22" rx="11" fill="#6E9EC9"/>
  </g>

</g>
</svg>
